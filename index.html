<!doctype html>
<html lang="en">
  <head>
    <script>
      // Filter out harmless [vite] HMR WebSocket connection logs in iframe preview
      (function(){
        const origErr = console.error;
        console.error = function(...args){
          if (args.some(arg => typeof arg === 'string' && (arg.includes('[vite]') || arg.includes('WebSocket') || arg.includes('websocket')))) return;
          origErr.apply(console, args);
        };
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ALTECH StockWise</title>
    <meta name="description" content="Production-ready inventory, sales, POS, and multi-store business management system powered by Supabase." />
    <meta name="theme-color" content="#0B1220" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="StockWise" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta property="og:title" content="ALTECH StockWise" />
    <meta property="og:description" content="Production-ready inventory, sales, POS, and multi-store business management system powered by Supabase." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

  </body>
</html>
